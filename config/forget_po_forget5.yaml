# FIUBench Appendix D, Table 7: LLaVA-Phi PO on forget5.
# Existing author configs are inherited without modification.
defaults:
  - forget_lora
  - _self_

model_family: llava-phi
# Override with the author's downloaded Stage I checkpoint path containing llava.
model_path: ./models/final_ft_10_epochs_lr2e-05_llava-phi_full
data_path: ./dataset/full.json
split: forget5
forget_loss: idk
lr: 3e-4
batch_size: 8
gradient_accumulation_steps: 16
num_epochs: 8
LoRA:
  r: 128
  alpha: 256
  dropout: 0.05

save_dir: /kaggle/working/models/llava_phi_PO_forget5
report_to: null
# Unspecified parameters retain repository defaults.
# Original forget.py requires FlashAttention-2; this config does not enable T4 support.
